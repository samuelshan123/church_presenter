# Publishes the display page to GitHub Pages so Chromecast / Google TV can
# load it as the Cast receiver (https://samuelshan123.github.io/church_presenter/?mode=cast).
#
# Google Cast only loads receivers over HTTPS. The same index.html is what the
# app serves to browser displays, so the TV always renders exactly like they do.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Publish Cast receiver

on:
  push:
    branches: [main]
    paths:
      - assets/presenter/web/**
      - .github/workflows/cast-receiver.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: assets/presenter/web
      - id: deployment
        uses: actions/deploy-pages@v4
